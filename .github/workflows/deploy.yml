name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

env:
  VPS_HOST: 157.180.72.95
  FRONTEND_REMOTE_PATH: /var/www/PhysicsGame
  BACKEND_REMOTE_PATH: /var/www/MyApi
  BACKEND_SERVICE_NAME: PhysicsGameApi

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Frontend (ReactJS) ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: EducationGameProject/physicsisfunny/package-lock.json

      - name: Install frontend dependencies
        working-directory: EducationGameProject/physicsisfunny
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        working-directory: EducationGameProject/physicsisfunny
        run: npm run build

      # ---------- Backend (.NET Web API) ----------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish backend
        run: dotnet publish EducationGameProject/Back/PhysicsGameApi/PhysicsGameApi.csproj -c Release -o EducationGameProject/Back/publish

      # ---------- Deploy ----------
      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy frontend build
        run: |
          rsync -avz --delete \
            EducationGameProject/physicsisfunny/build/ \
            ${{ secrets.SSH_USER }}@${{ env.VPS_HOST }}:${{ env.FRONTEND_REMOTE_PATH }}/

      - name: Deploy backend build
        run: |
          rsync -avz --delete \
            --exclude 'appsettings.Production.json' \
            EducationGameProject/Back/publish/ \
            ${{ secrets.SSH_USER }}@${{ env.VPS_HOST }}:${{ env.BACKEND_REMOTE_PATH }}/

      - name: Restart backend service & reload nginx
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ env.VPS_HOST }} "\
            sudo systemctl restart ${{ env.BACKEND_SERVICE_NAME }} && \
            sudo systemctl reload nginx"
